<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">UniBudget</title>
  <desc id="desc">Automated personal finance and decision-support system built with Excel and VBA.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061712"/>
      <stop offset="0.55" stop-color="#0b2d28"/>
      <stop offset="1" stop-color="#10213b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1010 30) rotate(135) scale(470 350)">
      <stop offset="0" stop-color="#22c55e" stop-opacity=".4"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#bbf7d0" stroke-opacity=".07"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#86efac" stroke-opacity=".25"/>

  <g transform="translate(74 68)">
    <rect width="9" height="211" rx="4.5" fill="#22c55e"/>
    <text x="40" y="74" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="69" font-weight="800" letter-spacing="1">UNIBUDGET</text>
    <text x="43" y="120" fill="#bbf7d0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" letter-spacing="2">PERSONAL FINANCE DECISION SUPPORT</text>
    <text x="43" y="165" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Track · Forecast · Detect · Simulate · Decide</text>
    <g transform="translate(43 194)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" font-weight="600">
      <rect width="102" height="34" rx="17" fill="#22c55e" fill-opacity=".15" stroke="#4ade80" stroke-opacity=".55"/>
      <text x="51" y="22" text-anchor="middle" fill="#86efac">EXCEL</text>
      <rect x="116" width="78" height="34" rx="17" fill="#38bdf8" fill-opacity=".15" stroke="#38bdf8" stroke-opacity=".55"/>
      <text x="155" y="22" text-anchor="middle" fill="#7dd3fc">VBA</text>
      <rect x="208" width="164" height="34" rx="17" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".5"/>
      <text x="290" y="22" text-anchor="middle" fill="#fde68a">FORECASTING</text>
    </g>
  </g>

  <g transform="translate(858 84)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 196h48v-50h44v50h48v-88h44v88h48V48h44" stroke="#86efac" stroke-width="12" opacity=".9"/>
    <path d="M16 230c51-8 83-41 122-70 39-29 77-42 126-103" stroke="#38bdf8" stroke-width="5"/>
    <path d="M246 57h25v25" stroke="#38bdf8" stroke-width="5"/>
    <circle cx="16" cy="230" r="7" fill="#38bdf8" stroke="none"/>
  </g>
</svg>
